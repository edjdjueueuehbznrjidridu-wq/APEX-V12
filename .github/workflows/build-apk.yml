name: Build APEX V11 APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'APEX_V11_ULTIMATE_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build APEX V11 APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platforms and build-tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;26.1.10909125"

      - name: Extract project ZIP
        run: |
          test -f APEX_V11_ULTIMATE_Android_Project.zip
          mkdir -p extracted
          unzip -q APEX_V11_ULTIMATE_Android_Project.zip -d extracted
          if [ -f extracted/settings.gradle ]; then
            echo "Project at extracted/"
          else
            TOP=$(ls -1 extracted | head -1)
            if [ -d "extracted/$TOP" ] && [ -f "extracted/$TOP/settings.gradle" ]; then
              mv extracted/$TOP/* extracted/
              rmdir extracted/$TOP 2>/dev/null || true
            fi
          fi
          test -f extracted/settings.gradle
          ls -la extracted/

      - name: Fix Chaquopy abiFilters
        run: |
          if ! grep -q 'abiFilters' extracted/app/build.gradle; then
            sed -i '/defaultConfig {/a\        ndk {\n            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"\n        }' extracted/app/build.gradle
          fi
          cat extracted/app/build.gradle

      - name: Verify project integrity
        run: |
          cd extracted
          python tools/verify_project.py

      - name: Build debug APK
        run: |
          cd extracted
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APEX-V11-ULTIMATE-debug-apk
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
